apiVersion: v1
kind: Service
metadata:
  name: pcforge
  labels:
    {{- include "pcforge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pcforge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
