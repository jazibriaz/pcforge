{{- if .Values.alerts.enabled }}
# App-level alerts ship with the app: the team that owns the service owns its alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pcforge
  labels:
    {{- include "pcforge.labels" . | nindent 4 }}
spec:
  groups:
    - name: pcforge.{{ .Release.Namespace }}
      rules:
        - alert: PCForgeHighErrorRate
          expr: |
            sum(rate(pcforge_http_requests_total{namespace="{{ .Release.Namespace }}",status=~"5.."}[5m]))
              /
            sum(rate(pcforge_http_requests_total{namespace="{{ .Release.Namespace }}"}[5m]))
              > {{ .Values.alerts.errorRateThreshold }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PCForge in {{ .Release.Namespace }}: 5xx error ratio above {{ .Values.alerts.errorRateThreshold }}"

        - alert: PCForgeHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(pcforge_http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}",endpoint!~"/readyz|/healthz"}[5m]))
            ) > {{ .Values.alerts.p95LatencySeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PCForge in {{ .Release.Namespace }}: p95 latency above {{ .Values.alerts.p95LatencySeconds }}s for 10 minutes"

        - alert: PCForgeTooFewHealthyPods
          expr: |
            sum(up{namespace="{{ .Release.Namespace }}",service="pcforge"}) < {{ .Values.alerts.minHealthyPods }}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PCForge in {{ .Release.Namespace }}: fewer than {{ .Values.alerts.minHealthyPods }} pods are being scraped successfully"
{{- end }}
