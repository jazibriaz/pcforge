name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "charts/**"
  workflow_dispatch: {}
concurrency:
  group: ci-main
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::833167447551:role/pcforge-github-ci
  ECR_REPOSITORY: 833167447551.dkr.ecr.eu-west-1.amazonaws.com/pcforge
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Short commit SHA = image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build --build-arg APP_VERSION="$TAG" -t "$ECR_REPOSITORY:$TAG" .
          docker push "$ECR_REPOSITORY:$TAG"
      - name: Bump dev image tag in Git
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 \"$TAG\"/" k8s/overlays/dev/kustomization.yaml
          git config user.name "pcforge-ci"
          git config user.email "pcforge-ci@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "deploy(dev): pcforge $TAG"
          git push
