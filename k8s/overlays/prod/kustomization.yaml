apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pcforge-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - pdb.yaml
patches:
  - target: { kind: Deployment, name: pcforge }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 256Mi }
images:
  - name: pcforge
    newName: 833167447551.dkr.ecr.eu-west-1.amazonaws.com/pcforge
    newTag: latest
